name: Quality gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: rag-service/requirements.txt

      - name: Install JavaScript dependencies
        run: |
          npm ci
          npm --prefix client ci
          npm --prefix server ci

      - name: Install locked RAG dependencies
        run: python -m pip install --require-hashes -r rag-service/requirements.txt

      - name: Run unit, contract, and answer-quality gates
        run: npm test

      - name: Build production bundles
        run: npm run build
