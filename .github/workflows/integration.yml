name: Infrastructure integration gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: chatllm_test
          POSTGRES_USER: chatllm
          POSTGRES_PASSWORD: integration-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chatllm -d chatllm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/integration-password
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd "wget -q --spider http://localhost:7474 || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgres://chatllm:integration-password@127.0.0.1:5432/chatllm_test
      DATABASE_URL: postgres://chatllm:integration-password@127.0.0.1:5432/chatllm_test
      REDIS_URL: redis://127.0.0.1:6379/0
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_ACCESS_KEY: chatllm-integration
      S3_SECRET_KEY: integration-secret-password
      S3_BUCKET: integration-documents
      JWT_SECRET: integration-jwt-secret-with-more-than-32-characters
      RAG_SERVICE_TOKEN: integration-rag-service-token-at-least-32-characters
      DEEPSEEK_API_KEY: integration-provider-key
      CLEANUP_JOBS_INTEGRATION: '1'
      AVATAR_REPLACEMENT_INTEGRATION: '1'
      QUEUE_HEALTH_INTEGRATION: '1'
      RAG_EVAL_SNAPSHOT_INTEGRATION: '1'
      UPLOAD_QUOTA_INTEGRATION: '1'
      MINIO_MULTIPART_INTEGRATION: '1'
      RETRIEVAL_CACHE_POSTGRES_INTEGRATION: '1'
      TEST_NEO4J_URL: http://127.0.0.1:7474
      NEO4J_ENABLED: 'true'
      NEO4J_URL: http://127.0.0.1:7474
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: integration-password
      NEO4J_DATABASE: neo4j
      ELASTICSEARCH_ENABLED: 'false'
      MILVUS_URI: http://127.0.0.1:19530
      MILVUS_COLLECTION: integration_chunks
      EMBEDDING_PROVIDER: local
      EMBEDDING_DIMENSION: '64'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: rag-service/requirements.txt

      - name: Start MinIO
        run: |
          docker run --detach --name chatllm-minio-ci \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER="$S3_ACCESS_KEY" \
            --env MINIO_ROOT_PASSWORD="$S3_SECRET_KEY" \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs chatllm-minio-ci
          exit 1

      - name: Install integration dependencies
        run: |
          npm --prefix server ci
          python -m pip install --require-hashes -r rag-service/requirements.txt

      - name: Build server integration target
        run: npm --prefix server run build

      - name: Run PostgreSQL and MinIO integration tests
        working-directory: server
        run: >-
          node --import ./test/setup-env.mjs --test
          test/avatar-replacement-postgres.integration.test.mjs
          test/cleanup-jobs-postgres.integration.test.mjs
          test/queue-health.test.mjs
          test/rag-eval-snapshots.test.mjs
          test/storage-minio.integration.test.mjs
          test/upload-quota-postgres.integration.test.mjs

      - name: Run RAG PostgreSQL and Neo4j integration tests
        working-directory: rag-service
        run: |
          python -m unittest discover -s tests -p 'test_retrieval_cache.py'
          python -m unittest discover -s tests -p 'test_graph_atomicity.py'
